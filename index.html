<style>
body {
    margin: 0;
    font-family: -apple-system, "Sarabun", sans-serif;

}

/* SPLASH SCREEN */
.splash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #007aff, #5ac8fa);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 9999;
    animation: fadeOut 1s ease 2s forwards;
}

.splash h1 {
    font-size: 32px;
    margin: 0;
}

.splash p {
    margin-top: 10px;
    font-size: 16px;
    opacity: 0.9;
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

.header {
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px);} 
    to { opacity: 1; transform: translateY(0);} 
}

.card {
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
    background: white;
    animation: cardPop 0.5s ease;
}

@keyframes cardPop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
}

button {
    background: #007aff;
    color: white;
}

.item {
    padding: 12px;
    border-bottom: 1px solid #eee;
    animation: fadeIn 0.4s ease;
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
}

.actions button {
    width: auto;
    margin-right: 5px;
    background: #e5e5ea;
    color: black;
    font-size: 12px;
}
</style>
</head>
